<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube reliability | Live line rankings</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="https://lolstar123.github.io/just-a-little-further/">Atul / projects</a><nav><a href="https://devpost.com/software/tfl-elo-tracker">QuantiHack 2026</a><a href="https://github.com/LolStar123/tfl-reliability">Source</a></nav></header>
<main>
<section class="hero"><div><h1>Tube reliability</h1></div><span id="updated" role="status">Loading observations…</span></section>
<details class="tools"><summary>Source &amp; CSV</summary><div class="toolbar"><label>Observations<select id="dataset"><option value="live">Live collection</option><option value="archive">Hackathon archive</option></select></label><button id="refresh">Refresh</button><button id="download">Export CSV</button><span id="connection" role="status"></span></div></details>
<div class="board-layout">
<section id="leaderboard" class="view"><div class="board-title"><h2>Ranking</h2><span>Elo rating</span></div><div id="lines" aria-label="Underground line rankings"></div><p id="notice"></p></section>
<section id="history" class="view"><div class="chart-head"><h2>Rating history</h2><button id="all-lines" type="button" hidden>Show all</button></div><div class="timeframes" role="group" aria-label="Chart timeframe"><button data-hours="1">1h</button><button data-hours="6">6h</button><button data-hours="24" aria-pressed="true">24h</button><button data-hours="168">Week</button><button data-hours="720">Month</button><button data-hours="0">All</button></div><p class="range-summary" aria-live="polite"></p><div id="history-chart"><div class="chart-loading" role="status" aria-label="Loading train history"></div></div><div id="line-toggles" aria-label="Tube lines"></div></section>
</div>
<details class="method"><summary>Method</summary><p>Missing predictions aren't cancellations. Service status is separate. <a href="https://github.com/LolStar123/tfl-reliability#what-the-ratings-mean">Rating method</a></p></details>
<details class="method"><summary>Five-minute rating candles</summary><section id="candles"><label>Line <select id="candle-line" aria-label="Candle chart line"></select></label><div id="candle-chart"></div></section></details><details class="method"><summary>Recent sampled events</summary><section id="events"><div id="event-list"></div></section></details><section id="why" hidden></section>
</main>
<script type="module" src="app.mjs"></script>
</body></html>
