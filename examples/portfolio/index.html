<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tube reliability leaderboard</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="https://lolstar123.github.io/just-a-little-further/">atul / tube elo</a><nav><a href="https://devpost.com/software/tfl-elo-tracker">devpost</a><a href="https://github.com/LolStar123/tfl-reliability">source</a></nav></header>
<main>
<section class="hero"><p>live train observations</p><h1>which Tube line<br><em>keeps its rating?</em></h1><span id="updated">loading…</span></section>
<section id="history" class="view">
    <div class="chart-head"><h2>all eleven lines</h2><div class="timeframes" role="group" aria-label="Chart timeframe"><button data-hours="1">1h</button><button data-hours="6">6h</button><button data-hours="24" aria-pressed="true">24h</button><button data-hours="168">week</button><button data-hours="720">month</button><button data-hours="0">all</button></div></div>
    <p class="range-summary" aria-live="polite"></p>
    <div id="history-chart"></div>
    <div id="line-toggles" aria-label="Tube lines"></div>
</section>
<section id="leaderboard" class="view">
    <div class="board-title"><h2>table</h2><span>rating</span></div>
    <div id="lines"></div>
    <p id="notice"></p>
</section>
<details class="tools"><summary>data tools</summary><div class="toolbar"><label>source<select id="dataset"><option value="live">live collection</option><option value="archive">hackathon archive</option></select></label><button id="refresh">refresh</button><button id="download">export</button></div><span id="connection"></span></details>
<section id="candles" hidden><select id="candle-line"></select><div id="candle-chart"></div></section><section id="events" hidden><div id="event-list"></div></section><section id="why" hidden></section>
</main>
<script type="module" src="app.mjs"></script></body></html>
