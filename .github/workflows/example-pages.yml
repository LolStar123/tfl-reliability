name: live tube reliability
on:
  push:
    branches: [main]
    paths: ['examples/portfolio/**', 'tools/**', '.github/workflows/example-pages.yml', 'tfl_line_elo.py']
  schedule:
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
    - cron: '57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-tube-feed
  cancel-in-progress: false
  queue: max
jobs:
  example:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore real observation history
        shell: bash
        run: |
          mkdir -p observations
          if git show-ref --verify --quiet refs/remotes/origin/observations; then
            git show origin/observations:history.json > observations/history.json
            git show origin/observations:events.json > observations/events.json 2>/dev/null || rm -f observations/events.json
          fi
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: node --test examples/portfolio/*.test.mjs
      - name: Collect and persist real Tube observations
        shell: bash
        run: |
          cycles=1
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then cycles=6; fi
          for ((cycle=1; cycle<=cycles; cycle++)); do
            started=$(date +%s)
            echo "Collection cycle $cycle of $cycles"
            python tools/collect_public.py
            python tools/collect_events.py
            python tools/audit_public.py
            python tools/persist_observations.py
            if (( cycle < cycles )); then
              elapsed=$(($(date +%s)-started))
              wait=$((600-elapsed))
              if (( wait > 0 )); then sleep "$wait"; fi
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/portfolio
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published dashboard feed
        run: python tools/check_deployment.py
