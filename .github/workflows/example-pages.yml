name: live tube reliability
on:
  push:
    branches: [main]
    paths: ['examples/portfolio/**', 'tools/**', '.github/workflows/example-pages.yml', 'tfl_line_elo.py']
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-tube-feed
  cancel-in-progress: false
jobs:
  example:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore real observation history
        shell: bash
        run: |
          mkdir -p observations
          if git show-ref --verify --quiet refs/remotes/origin/observations; then
            git show origin/observations:history.json > observations/history.json
          fi
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: node --test examples/portfolio/model.test.mjs
      - name: Collect current TfL service and calculate ratings
        run: python tools/collect_public.py
      - name: Audit live ratings and cross-language agreement
        run: python tools/audit_public.py
      - name: Persist observations independently of the source branch
        run: python tools/persist_observations.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/portfolio
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the published dashboard feed
        run: python tools/check_deployment.py
