name: public dashboard browser audit
on:
  workflow_dispatch:
  schedule:
    - cron: '33 */4 * * *'
  workflow_run:
    workflows: ['live tube reliability']
    types: [completed]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_audit.py
        env:
          AUDIT_URL: https://lolstar123.github.io/tfl-reliability/
